<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de Servicio Técnico - ITS Panama">
  <title>Formulario de Servicio Técnico | ITS Panama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=AbeeZee:ital@0;1&family=Arial&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="dist/html2pdf.bundle.min.js" defer></script>
  <script src="dist/FileSaver.min.js" defer></script>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;,">
  <style>
    /* Dark Mode Styles */
    body.dark-mode {
      --color-background: #1a1a2e;
      --color-white: #2d2d44;
      --color-gray: #aaa;
      --color-border: #444;
      --shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }
    
    body.dark-mode label {
      color: #fff;
    }
    
    body.dark-mode input[type="text"],
    body.dark-mode input[type="datetime-local"],
    body.dark-mode textarea {
      background: #1a1a2e;
      color: #fff;
      border-color: #444;
    }
    
    body.dark-mode fieldset {
      border-color: #444;
    }
    
    body.dark-mode legend {
      color: #fff;
    }
    
    body.dark-mode .help-text {
      color: #888;
    }
    
    body.dark-mode #encabezado,
    body.dark-mode #footer {
      background-color: var(--color-background);
    }
    
    /* Theme Toggle Button */
    .theme-toggle-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }
    
    .theme-toggle-btn {
      background: var(--color-primary);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1.3rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .theme-toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    
    .admin-link {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-primary);
      color: white;
      padding: 12px 18px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    .admin-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    
    /* Save to DB Button */
    .btn-save {
      background-color: #007bff;
      color: white;
    }
    
    .btn-save:hover:not(:disabled) {
      background-color: #0056b3;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="theme-toggle-container">
    <button class="theme-toggle-btn" id="themeToggle" title="Cambiar tema">
      <span id="themeIcon">🌙</span>
      <span id="themeText">Modo Oscuro</span>
    </button>
  </div>
  
  <a href="admin/login.php" class="admin-link">🔐 Admin</a>
  <header id="encabezado" role="banner">
    <img src="logo.png" alt="ITS Panama Logo" id="logo">
    <h1 id="titulo">Formulario de Servicio Técnico</h1>
  </header>

  <main role="main">
    <form id="serviceForm" novalidate>
      <fieldset>
        <legend>Datos del Servicio</legend>
        <div class="fila">
          <div class="columna">
            <label for="cliente">
              Cliente:
              <input type="text" id="cliente" name="cliente" required 
                     autocomplete="name" placeholder="Nombre del cliente"
                     aria-required="true">
            </label>
          </div>
          <div class="columna">
            <label for="fecha">
              Fecha y Hora:
              <input type="datetime-local" id="fecha" name="fecha" required 
                     aria-required="true">
            </label>
          </div>
        </div>

        <div class="fila">
          <div class="columna">
            <label for="direccion">
              Dirección:
              <input type="text" id="direccion" name="direccion" required 
                     autocomplete="street-address" placeholder="Dirección completa"
                     aria-required="true">
            </label>
          </div>
          <div class="columna">
            <label for="ticket">
              Ticket No.:
              <input type="text" id="ticket" name="ticket" required 
                     pattern="[A-Za-z0-9\-]+" placeholder="Ej: TK-001"
                     aria-required="true" aria-describedby="ticketHelp">
            </label>
            <small id="ticketHelp" class="help-text">Solo letras, números y guiones</small>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Detalles del Servicio</legend>
        <div class="fila">
          <div class="columna columna-full">
            <label for="reporte">
              Reporte del Cliente:
              <textarea id="reporte" name="reporte" rows="4" required 
                        placeholder="Descripción del problema reportado"
                        aria-required="true"></textarea>
            </label>
          </div>
        </div>

        <div class="fila">
          <div class="columna">
            <label for="diagnostico">
              Diagnóstico Técnico:
              <textarea id="diagnostico" name="diagnostico" rows="4" required 
                        placeholder="Diagnóstico realizado por el técnico"
                        aria-required="true"></textarea>
            </label>
          </div>
          <div class="columna">
            <label for="trabajoRealizado">
              Trabajo Realizado:
              <textarea id="trabajoRealizado" name="trabajoRealizado" rows="4" required 
                        placeholder="Descripción del trabajo ejecutado"
                        aria-required="true"></textarea>
            </label>
          </div>
        </div>

        <div class="fila">
          <div class="columna columna-full">
            <label for="observaciones">
              Observaciones/Recomendaciones:
              <textarea id="observaciones" name="observaciones" rows="4" required 
                        placeholder="Observaciones adicionales y recomendaciones"
                        aria-required="true"></textarea>
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Aprobación</legend>
        <div class="fila">
          <div class="columna">
            <label for="recibidoConforme">
              Recibido Conforme:
              <input type="text" id="recibidoConforme" name="recibidoConforme" required 
                     autocomplete="name" placeholder="Nombre quien recibe"
                     aria-required="true">
            </label>
          </div>
          <div class="columna">
            <label for="firmaTecnico">
              Firma Técnico:
              <input type="text" id="firmaTecnico" name="firmaTecnico" required 
                     autocomplete="name" placeholder="Nombre del técnico"
                     aria-required="true">
            </label>
          </div>
        </div>
      </fieldset>
    </form>

    <div id="mensaje" class="mensaje" role="alert" aria-live="polite"></div>

    <div class="acciones">
      <button type="button" id="btnGuardar" class="btn btn-save" aria-label="Guardar en base de datos">
        💾 Guardar
      </button>
      <button type="button" id="btnGenerarPDF" class="btn btn-pdf" aria-label="Generar PDF del formulario">
        📄 Generar PDF
      </button>
      <button type="button" id="btnLimpiar" class="btn btn-secondary" aria-label="Limpiar formulario">
        🗑️ Limpiar
      </button>
    </div>
  </main>

  <footer id="footer" role="contentinfo">
    <p id="poweredByText">Powered by</p>
    <div id="poweredByContainer">
      <img src="logo2.png" alt="OkamiApps Logo" id="poweredByLogo">
    </div>
    <p class="footer-info">
      ITS Panama | soporte@itspanama.net | www.itspanama.net
    </p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
